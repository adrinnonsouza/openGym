name: Pump Life checks
on:
  pull_request:
    paths:
      - 'api/**'
      - 'frontend/**'
      - '.github/workflows/pump-life-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: node --check api/server.js
      - run: node --test api/test/subscription-plans.test.js api/test/kiwify.test.js api/test/entitlements.test.js
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
